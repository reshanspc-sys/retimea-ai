
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETIMEA AI — Intelligence for Everyone</title>
<style>
:root {
  --bg:#07111f; --panel:#101e30; --panel2:#14263b;
  --blue:#238bff; --cyan:#35e0ed; --text:#edf5ff;
  --muted:#91a7c0; --border:#233b55;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(circle at top right,#102c49,var(--bg) 48%);
  color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
}
header{
  padding:20px 6%;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.logo{font-size:25px;font-weight:800;letter-spacing:2px}
.logo span{color:var(--cyan)}
header small{color:var(--muted)}
main{max-width:1100px;margin:45px auto;padding:0 20px}
.hero{text-align:center;margin-bottom:35px}
.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 12px}
.hero h1 span{color:var(--cyan)}
.hero p{color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.tool{
  text-align:left;background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--border);border-radius:15px;padding:22px;
  color:var(--text);cursor:pointer;transition:.2s;
}
.tool:hover,.tool.active{border-color:var(--cyan);transform:translateY(-3px)}
.tool .symbol{font-size:28px}
.tool h3{margin:13px 0 8px}
.tool p{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
.workspace{
  margin-top:28px;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:22px;
}
.workspace h2{margin-top:0}
#messages{
  height:300px;overflow-y:auto;background:#081422;border-radius:10px;
  padding:15px;margin:16px 0;
}
.message{padding:11px 13px;border-radius:10px;margin:8px 0;
  white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.user{background:#163b60;margin-left:12%}
.assistant{background:#17283b;margin-right:12%}
form{display:flex;gap:10px}
textarea{
  flex:1;resize:vertical;min-height:52px;max-height:160px;
  background:#081422;color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:14px;font:inherit;
}
button.send{
  background:linear-gradient(120deg,var(--blue),var(--cyan));color:#06111e;
  border:0;border-radius:10px;padding:0 22px;font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.status{color:var(--muted);font-size:13px;margin-top:12px;min-height:18px}
footer{text-align:center;color:var(--muted);padding:30px;font-size:13px}
@media(max-width:520px){
  header{padding:17px 20px}header small{display:none}
  form{flex-direction:column}button.send{padding:15px}
  .workspace{padding:15px}
}
</style>
</head>
<body>
<header>
  <div class="logo">RETIMEA<span> AI</span></div>
  <small>Intelligence for Everyone</small>
</header>

<main>
  <section class="hero">
    <h1>Think. Create. <span>Achieve.</span></h1>
    <p>Your intelligent workspace for ideas, research, writing and business.</p>
  </section>

  <section class="grid" id="tools">
    <button class="tool active" data-tool="assistant">
      <div class="symbol">✦</div><h3>AI Assistant</h3>
      <p>Ask questions, solve problems and explore ideas.</p>
    </button>
    <button class="tool" data-tool="writer">
      <div class="symbol">✎</div><h3>AI Writer</h3>
      <p>Create articles, emails, books and professional content.</p>
    </button>
    <button class="tool" data-tool="research">
      <div class="symbol">⌕</div><h3>Research Studio</h3>
      <p>Organise information and explore complex topics.</p>
    </button>
    <button class="tool" data-tool="trading">
      <div class="symbol">↗</div><h3>Trading Research</h3>
      <p>Study gold and Bitcoin markets, setups and risk.</p>
    </button>
    <button class="tool" data-tool="translator">
      <div class="symbol">文</div><h3>Translator</h3>
      <p>Translate between Sinhala, English and other languages.</p>
    </button>
    <button class="tool" data-tool="business">
      <div class="symbol">◇</div><h3>Business AI</h3>
      <p>Develop business ideas, plans and strategies.</p>
    </button>
  </section>

  <section class="workspace">
    <h2 id="toolTitle">✦ AI Assistant</h2>
    <p id="toolDescription" style="color:var(--muted)">How can I help you today?</p>
    <div id="messages" aria-live="polite">
      <div class="message assistant">Welcome to RETIMEA AI. What would you like to work on?</div>
    </div>
    <form id="chatForm">
      <textarea id="prompt" placeholder="Type your message..." required></textarea>
      <button class="send" id="sendButton" type="submit">Send</button>
    </form>
    <div class="status" id="status">Connected interface · Ready</div>
  </section>
</main>

<footer>RETIMEA AI · Intelligence for Everyone</footer>

<script>
const descriptions = {
  assistant:"Ask questions, solve problems and explore ideas.",
  writer:"Create articles, emails, books and professional content.",
  research:"Organise information and explore complex topics.",
  trading:"Research gold and Bitcoin with a focus on risk management.",
  translator:"Translate between Sinhala, English and other languages.",
  business:"Develop business ideas, plans and strategies."
};

let selectedTool = "assistant";
let history = [];

const messages = document.getElementById("messages");
const promptBox = document.getElementById("prompt");
const statusBox = document.getElementById("status");
const sendButton = document.getElementById("sendButton");

function addMessage(role, content) {
  const item = document.createElement("div");
  item.className = "message " + role;
  item.textContent = content;
  messages.appendChild(item);
  messages.scrollTop = messages.scrollHeight;
}

document.querySelectorAll(".tool").forEach(button => {
  button.addEventListener("click", () => {
    selectedTool = button.dataset.tool;
    history = [];
    messages.innerHTML = "";
    document.querySelectorAll(".tool").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    document.getElementById("toolTitle").textContent =
      button.querySelector("h3").textContent;
    document.getElementById("toolDescription").textContent =
      descriptions[selectedTool];
    addMessage("assistant", "Welcome! You are now using " +
      button.querySelector("h3").textContent + ". How can I help?");
    statusBox.textContent = "Ready";
  });
});

document.getElementById("chatForm").addEventListener("submit", async event => {
  event.preventDefault();
  const text = promptBox.value.trim();
  if (!text) return;

  addMessage("user", text);
  history.push({role:"user", content:text});
  promptBox.value = "";
  sendButton.disabled = true;
  statusBox.textContent = "RETIMEA AI is thinking...";

  try {
    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({tool:selectedTool, messages:history})
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");

    const reply = data.reply || "I couldn't generate a response.";
    addMessage("assistant", reply);
    history.push({role:"assistant", content:reply});
    statusBox.textContent = "Response received";
  } catch (error) {
    addMessage("assistant", "Sorry, something went wrong. Please try again.");
    history.pop();
    statusBox.textContent = "Connection error. Please check your deployment.";
  } finally {
    sendButton.disabled = false;
    promptBox.focus();
  }
});
</script>
</body>
</html>
